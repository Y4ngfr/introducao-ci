name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main  

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.x"

      - name: Compilar a aplicacao
        run: go build .

      - name: Executar os testes
        run: go test -v ./...

      - name: Construir Imagem Docker
        run: docker build -t introducao-ci-app:latest .